<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive OSI Model Matrix</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --border-color: #22314d;
            --accent-color: #CCFF00;
            --error-color: #FF3333;
            --text-main: #FFFFFF;
            --text-muted: #8fa0bc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 5px;
            font-weight: 600;
        }

        p.instructions {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: transparent;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-verify {
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }

        .btn-verify:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 10px rgba(204, 255, 0, 0.3);
        }

        .btn-reset {
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .btn-reset:hover {
            border-color: #3b5177;
            color: var(--text-main);
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
        }

        /* OSI Stack Styles */
        .osi-stack {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .layer-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .layer-number {
            background-color: #0e1524;
            padding: 20px;
            font-weight: bold;
            border-right: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .layer-dropzone {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            background-color: var(--bg-color);
            margin: 5px;
            border: 1px dashed var(--border-color);
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .layer-dropzone.drag-over {
            border-color: var(--accent-color);
            background-color: #1a261a;
        }

        /* Draggable Item Styles */
        .draggable-pool {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 20px;
        }

        .draggable-pool h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--text-main);
        }

        .drag-item {
            background-color: #0e1524;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 4px;
            cursor: grab;
            user-select: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .drag-item:active {
            cursor: grabbing;
        }

        /* Row Feedback Validation States */
        .layer-row.correct {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(204, 255, 0, 0.15);
        }
        .layer-row.correct .layer-number {
            color: var(--accent-color);
            border-right-color: var(--accent-color);
        }

        .layer-row.incorrect {
            border-color: var(--error-color);
            box-shadow: 0 0 8px rgba(255, 51, 51, 0.15);
        }
        .layer-row.incorrect .layer-number {
            color: var(--error-color);
            border-right-color: var(--error-color);
        }

        .status-banner {
            display: none;
            padding: 15px 30px;
            border-radius: 4px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
        }

        .status-banner.success {
            background-color: #111e16;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }

        .status-banner.fail {
            background-color: #241212;
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }
    </style>
</head>
<body>

    <p class="instructions">Drag each profile block to its correct OSI Layer, then click "Verify Matrix" to check your alignment.</p>

    <div class="controls">
        <button class="btn-verify" onclick="verifyMatrix()">Verify Matrix</button>
        <button class="btn-reset" onclick="resetMatrix()">Reset Task</button>
    </div>

    <div class="status-banner" id="statusBanner"></div>
