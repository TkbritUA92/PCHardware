<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive OSI Model Matrix</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #131c2e;
            --node-bg: #1e293b;
            --accent-blue: #0ea5e9;
            --accent-purple: #a855f7;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            
            --success-bg: rgba(34, 197, 94, 0.1);
            --error-bg: rgba(239, 68, 68, 0.1);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: var(--text-light);
            margin: 0 0 5px 0;
            font-weight: 600;
            font-size: 1.8rem;
        }

        p.instructions {
            color: var(--text-muted);
            margin: 0 0 15px 0;
            font-size: 0.95rem;
            text-align: center;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: transparent;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-verify {
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-verify:hover {
            background-color: var(--accent-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }

        .btn-reset {
            border: 1px solid var(--node-bg);
            color: var(--text-muted);
        }

        .btn-reset:hover {
            border-color: var(--text-muted);
            color: var(--text-light);
        }

        .status-banner {
            display: none;
            padding: 12px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
        }

        .status-banner.success {
            background-color: var(--success-bg);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .status-banner.fail {
            background-color: var(--error-bg);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
        }

        /* Responsive Main Container */
        .container {
            display: flex;
            gap: 25px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
        }

        /* OSI Stack */
        .osi-stack {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .layer-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            border: 1px solid var(--node-bg);
            background-color: var(--panel-bg);
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .layer-number {
            background-color: var(--node-bg);
            padding: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            border-right: 1px solid var(--node-bg);
            display: flex;
            align-items: center;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .layer-dropzone {
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 45px;
            background-color: var(--bg-dark);
            margin: 5px;
            border: 1px dashed var(--node-bg);
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .layer-dropzone.drag-over {
            border-color: var(--accent-blue);
            background-color: rgba(14, 165, 233, 0.05);
        }

        /* Draggable Options Pool */
        .draggable-pool {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--node-bg);
            padding: 20px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 20px;
        }

        .draggable-pool h3 {
            margin: 0;
            border-bottom: 1px solid var(--node-bg);
            padding-bottom: 10px;
            color: var(--accent-purple);
            font-size: 1.1rem;
        }

        .drag-item {
            background-color: var(--node-bg);
            border: 1px solid transparent;
            color: var(--text-light);
            padding: 12px 15px;
            border-radius: 4px;
            cursor: grab;
            user-select: none;
            font-size: 0.85rem;
            line-height: 1.4;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .drag-item:active {
            cursor: grabbing;
        }

        .drag-item:hover {
            border-color: var(--accent-blue);
        }

        /* Verification States */
        .layer-row.correct {
            border-color: var(--accent-green);
            box-shadow: 0 0 8px rgba(34, 197, 150, 0.1);
        }
        .layer-row.correct .layer-number {
            color: var(--accent-green);
            border-right-color: var(--accent-green);
        }

        .layer-row.incorrect {
            border-color: var(--accent-red);
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.1);
        }
        .layer-row.incorrect .layer-number {
            color: var(--accent-red);
            border-right-color: var(--accent-red);
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .draggable-pool {
                position: static;
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <h1>OSI Model Matrix Challenge</h1>
    <p class="instructions">Drag each profile block to its correct OSI Layer, then click "Verify Matrix" to check your alignment.</p>

    <div class="controls">
        <button class="btn-verify" onclick="verifyMatrix()">Verify Matrix</button>
        <button class="btn-reset" onclick="resetMatrix()">Reset Task</button>
    </div>

    <div class="status-banner" id="statusBanner"></div>

    <div class="container">
        <div class="osi-stack">
            <div class="layer-row" id="row-7" data-layer="7">
                <div class="layer-number">Layer 7: Application</div>
                <div class="layer-dropzone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
            </div>
            <div class="layer-row" id="row-6" data-layer="6">
                <div class="layer-number">Layer 6: Presentation</div>
                <div class="layer-dropzone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
            </div>
            <div class="layer-row" id="row-5" data-layer="5">
                <div class="layer-number">Layer 5: Session</div>
                <div class="layer-dropzone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
            </div>
            <div class="layer-row" id="row-4" data-layer="4">
                <div class="layer-number">Layer 4: Transport</div>
                <div class="layer-dropzone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
            </div>
            <div class="layer-row" id="row-3" data-layer="3">
                <div class="layer-number">Layer 3: Network</div>
                <div class="layer-dropzone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
            </div>
            <div class="layer-row" id="row-2" data-layer="2">
                <div class="layer-number">Layer 2: Data Link</div>
                <div class="layer-dropzone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
            </div>
            <div class="layer-row" id="row-1" data-layer="1">
                <div class="layer-number">Layer 1: Physical</div>
                <div class="layer-dropzone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
            </div>
        </div>

        <div class="draggable-pool" id="itemPool">
            <h3>Profile Options</h3>
        </div>
    </div>

    <script>
        const initialProfiles = [
            { id: "p7", target: "7", text: "Data | Network services to apps | HTTP, HTTPS, DNS, SMTP" },
            { id: "p6", target: "6", text: "Data | Encryption, compression & formatting | SSL/TLS, JPEG" },
            { id: "p5", target: "5", text: "Data | Managing & terminating sessions | NetBIOS, RPC, Sockets" },
            { id: "p4", target: "4", text: "Segments/Datagrams | End-to-end flow control | TCP, UDP, Ports" },
            { id: "p3", target: "3", text: "Packets | Path determination & logical addressing | IP, Routers" },
            { id: "p2", target: "2", text: "Frames | Physical addressing & media access | MAC, Switches, NICs" },
            { id: "p1", target: "1", text: "Bits | Bit stream transmission over physical medium | Cables, Hubs" }
        ];

        window.addEventListener('DOMContentLoaded', initTask);

        function initTask() {
            const pool = document.getElementById('itemPool');
            pool.querySelectorAll('.drag-item').forEach(el => el.remove());
            
            const shuffled = [...initialProfiles].sort(() => Math.random() - 0.5);
            
            shuffled.forEach(item => {
                const div = document.createElement('div');
                div.className = 'drag-item';
                div.draggable = true;
                div.id = item.id;
                div.setAttribute('data-target', item.target);
                div.innerText = item.text;
                div.addEventListener('dragstart', dragStart);
                pool.appendChild(div);
            });
        }

        function dragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.id);
            clearVisualFeedback();
        }

        function allowDrop(e) {
            e.preventDefault();
            const dropzone = e.target.closest('.layer-dropzone');
            if (dropzone && !dropzone.hasChildNodes()) {
                dropzone.classList.add('drag-over');
            }
        }

        function dragLeave(e) {
            const dropzone = e.target.closest('.layer-dropzone');
            if (dropzone) {
                dropzone.classList.remove('drag-over');
            }
        }

        function drop(e) {
            e.preventDefault();
            const dropzone = e.target.closest('.layer-dropzone');
            if (!dropzone) return;
            
            dropzone.classList.remove('drag-over');
            if (dropzone.hasChildNodes()) return;

            const id = e.dataTransfer.getData('text/plain');
            const draggedElement = document.getElementById(id);
            
            if (draggedElement) {
                dropzone.appendChild(draggedElement);
                clearVisualFeedback();
            }
        }

        function verifyMatrix() {
            const rows = document.querySelectorAll('.layer-row');
            let totalCorrect = 0;
            let totalPlaced = 0;
            const banner = document.getElementById('statusBanner');

            rows.forEach(row => {
                const targetLayer = row.getAttribute('data-layer');
                const dropzone = row.querySelector('.layer-dropzone');
                const childItem = dropzone.querySelector('.drag-item');

                row.classList.remove('correct', 'incorrect');

                if (childItem) {
                    totalPlaced++;
                    if (childItem.getAttribute('data-target') === targetLayer) {
                        row.classList.add('correct');
                        totalCorrect++;
                    } else {
                        row.classList.add('incorrect');
                    }
                }
            });

            banner.style.display = 'block';

            if (totalCorrect === rows.length) {
                banner.className = "status-banner success";
                banner.innerText = "✓ Verification Complete: All layers are mapping out perfectly.";
                document.querySelectorAll('.drag-item').forEach(item => item.draggable = false);
            } else {
                banner.className = "status-banner fail";
                if (totalPlaced < rows.length) {
                    banner.innerText = "✗ Verification Failed: Some spaces are still empty. Complete the matrix and try again.";
                } else {
                    banner.innerText = `✗ Verification Failed: ${rows.length - totalCorrect} alignment errors detected. Correct the red elements or clear to reset.`;
                }
            }
        }

        function clearVisualFeedback() {
            document.querySelectorAll('.layer-row').forEach(row => {
                row.classList.remove('correct', 'incorrect');
            });
            document.getElementById('statusBanner').style.display = 'none';
        }

        function resetMatrix() {
            const dropzones = document.querySelectorAll('.layer-dropzone');
            dropzones.forEach(zone => {
                while (zone.firstChild) {
                    zone.removeChild(zone.firstChild);
                }
            });
            clearVisualFeedback();
            initTask();
        }

        document.getElementById('itemPool').addEventListener('dragover', (e) => e.preventDefault());
        document.getElementById('itemPool').addEventListener('drop', (e) => {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            const draggedElement = document.getElementById(id);
            if (draggedElement) {
                document.getElementById('itemPool').appendChild(draggedElement);
                clearVisualFeedback();
            }
        });
    </script>
</body>
</html>
