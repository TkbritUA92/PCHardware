<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Subsystems Matrix Architecture Lab</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #131c2e;
            --node-bg: #1e293b;
            --accent-blue: #0ea5e9;
            --accent-purple: #a855f7;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            
            --success-bg: rgba(34, 197, 94, 0.1);
            --error-bg: rgba(239, 68, 68, 0.1);
        }

        html, body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100vw;
        }

        body {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 20px;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--text-light);
            margin: 0 0 5px 0;
            font-weight: 600;
            font-size: 1.8rem;
        }

        p.instructions {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .controls {
            margin: 15px 0;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: transparent;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-verify {
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-verify:hover {
            background-color: var(--accent-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }

        .btn-reset {
            border: 1px solid var(--node-bg);
            color: var(--text-muted);
        }

        .btn-reset:hover {
            border-color: var(--text-muted);
            color: var(--text-light);
        }

        .status-banner {
            display: none;
            padding: 12px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
        }

        .status-banner.success {
            background-color: var(--success-bg);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .status-banner.fail {
            background-color: var(--error-bg);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
        }

        .container {
            display: flex;
            gap: 25px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
        }

        .hardware-stack {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .layer-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            border: 1px solid var(--node-bg);
            background-color: var(--panel-bg);
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .layer-number {
            background-color: var(--node-bg);
            padding: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            border-right: 1px solid var(--node-bg);
            display: flex;
            align-items: center;
            color: var(--text-muted);
        }

        .layer-dropzone {
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 45px;
            background-color: var(--bg-dark);
            margin: 5px;
            border: 1px dashed var(--node-bg);
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .layer-dropzone.drag-over {
            border-color: var(--accent-blue);
            background-color: rgba(14, 165, 233, 0.05);
        }

        .draggable-pool {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--node-bg);
            padding: 20px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 20px;
        }

        .draggable-pool h3 {
            margin: 0;
            border-bottom: 1px solid var(--node-bg);
            padding-bottom: 10px;
            color: var(--accent-purple);
            font-size: 1.1rem;
        }

        .drag-item {
            background-color: var(--node-bg);
            border: 1px solid transparent;
            color: var(--text-light);
            padding: 12px 15px;
            border-radius: 4px;
