<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploring the Big Three: Advanced Core PC Hardware Lab</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #131c2e;
            --node-bg: #1e293b;
            --accent-blue: #0ea5e9;
            --accent-purple: #a855f7;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .lab-wrapper {
            width: 100%;
            max-width: 1450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            color: var(--accent-blue);
        }

        .header-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .task-bar {
            display: flex;
            gap: 10px;
            background-color: var(--panel-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            align-items: center;
            flex-wrap: wrap;
        }

        .task-btn {
            background-color: #1e293b;
            color: var(--accent-blue);
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .task-btn:hover {
            background-color: #334155;
            color: white;
            border-color: var(--accent-blue);
        }

        .evidence-btn {
            background-color: rgba(249, 115, 22, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(249, 115, 22, 0.4);
        }

        .evidence-btn:hover {
            background-color: var(--accent-orange);
            color: var(--bg-dark);
            border-color: var(--accent-orange);
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 390px 1fr 350px;
            gap: 20px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 8px;
            margin-bottom: 5px;
        }

        .component-token {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: grab;
            font-weight: 600;
            text-align: center;
            font-size: 0.85rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 1px solid #1e40af;
        }

        .setting-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(15, 23, 42, 0.3);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }

        .setting-control label {
