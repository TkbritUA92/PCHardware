<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peripheral Matching Game</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .game-flex { display: flex; justify-content: space-between; margin-top: 20px; }
        .column { width: 45%; }
        .item { padding: 10px; margin: 10px 0; background: #e3f2fd; border: 2px solid #90caf9; border-radius: 4px; cursor: grab; text-align: center; font-weight: bold; }
        .dropzone { padding: 10px; margin: 10px 0; background: #f5f5f5; border: 2px dashed #bdbdbd; border-radius: 4px; min-height: 40px; text-align: center; }
        .dropzone.hover { background: #e0f2f1; border-color: #26a69a; }
        .correct { background: #c8e6c9 !important; border-color: #81c784 !important; }
        #result { margin-top: 20px; font-weight: bold; text-align: center; color: #2e7d32; }
    </style>
</head>
<body>

<div class="container">
    <h2>Match the Connector to the Device</h2>
    <p>Drag the connector type on the left into the correct peripheral slot on the right.</p>
    
    <div class="game-flex">
        <div class="column" id="connectors">
            <div class="item" draggable="true" id="hdmi">HDMI Cable</div>
            <div class="item" draggable="true" id="usb-v">USB-A / USB-C</div>
            <div class="item" draggable="true" id="xlr">XLR 3-Pin</div>
        </div>
        
        <div class="column">
            <div class="dropzone" data-match="usb-v">Standard Keyboard</div>
            <div class="dropzone" data-match="hdmi">External 4K Monitor</div>
            <div class="dropzone" data-match="xlr">Studio Condenser Mic</div>
        </div>
    </div>
    <div id="result"></div>
</div>

<script>
    const items = document.querySelectorAll('.item');
    const dropzones = document.querySelectorAll('.dropzone');
    let score = 0;

    items.forEach(item => {
        item.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', e.target.id); });
    });

    dropzones.forEach(zone => {
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('hover'); });
        zone.addEventListener('dragleave', () => { zone.classList.remove('hover'); });
        zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.classList.remove('hover');
            const draggedId = e.dataTransfer.getData('text/plain');
            
            if (zone.getAttribute('data-match') === draggedId) {
                const draggedElement = document.getElementById(draggedId);
                zone.appendChild(draggedElement);
                draggedElement.setAttribute('draggable', 'false');
                draggedElement.classList.add('correct');
                zone.classList.add('correct');
                score++;
                if(score === 3) document.getElementById('result').innerText = "🎉 Excellent! All connections are correct.";
            }
        });
    });
</script>
</body>
</html>
