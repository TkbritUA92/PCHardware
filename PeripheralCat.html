<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Peripheral Matrix Lab</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #0A0A0A;
            --bg-input: #1A1A1A;
            --accent: #CCFF00;
            --text-main: #FFFFFF;
            --text-muted: #A1A1AA;
            --border: #333333;
            
            /* Status Indicators matched to theme */
            --success-border: #28a745;
            --success-bg: rgba(40, 167, 69, 0.15);
            --error-border: #dc3545;
            --error-bg: rgba(220, 53, 69, 0.15);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .lab-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            position: relative;
        }

        /* Subtle top glow bar accent */
        .lab-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), transparent);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
            margin-bottom: 30px;
        }

        h1 { 
            margin: 0 0 12px 0; 
            color: var(--text-main); 
            font-size: 32px; 
            font-weight: 700;
        }
        
        h1 span {
            color: var(--accent);
        }

        .instructions { 
            color: var(--text-muted); 
            font-size: 16px; 
            margin: 0; 
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 15px;
        }

        .matrix-table th {
            background-color: var(--bg-input);
            color: var(--accent);
            text-align: left;
            padding: 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--border);
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.05em;
        }

        .matrix-table td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .hardware-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 16px;
            display: block;
        }

        .hardware-desc {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: normal;
            margin-top: 4px;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-input);
            color: var(--text-main);
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        select option {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        .controls {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-submit { 
            background-color: var(--accent); 
            color: #000000; 
        }
        .btn-submit:hover { 
            background-color: #b3ff00; 
            transform: translateY(-1px);
        }
        
        .btn-reset { 
            background-color: transparent; 
            color: var(--text-muted); 
            border: 1px solid var(--border);
        }
        .btn-reset:hover { 
            background-color: rgba(255, 255, 255, 0.05); 
            color: var(--text-main);
        }

        .score-display {
            font-size: 18px;
            font-weight: 600;
            display: none;
            padding: 14px;
            border-radius: 6px;
            text-align: center;
            flex-grow: 1;
            border: 1px solid transparent;
        }

        /* Architectural Validation States */
        .input-correct { 
            border-color: var(--success-border) !important; 
            background-color: var(--success-bg) !important; 
            color: #81c784 !important; 
        }
        .input-error { 
            border-color: var(--error-border) !important; 
            background-color: var(--error-bg) !important; 
            color: #e57373 !important; 
        }
    </style>
</head>
<body>

<div class="lab-container">
    <header>
        <h1>Hardware Matrix <span>Architecture Lab</span></h1>
        <p class="instructions">
            <strong>System Task:</strong> Match each device profile to its specific classification archetype, standard physical interface connector, and baseline throughput demand.
        </p>
    </header>

    <table class="matrix-table">
        <thead>
            <tr>
                <th style="width: 32%;">Hardware Profile</th>
                <th style="width: 22%;">1. Classification</th>
                <th style="width: 22%;">2. Interface Connector</th>
                <th style="width: 24%;">3. Throughput Pipeline</th>
            </tr>
        </thead>
        <tbody id="matrix-body">
            </tbody>
    </table>

    <div class="controls">
        <button class="btn-reset" onclick="resetForm()">Reset Matrix</button>
        <div id="scoreBox" class="score-display"></div>
        <button class="btn-submit" onclick="evaluateMatrix()">Verify Configuration</button>
    </div>
</div>

<script>
    const dataset = [
        {
            id: "omr",
            name: "Optical Mark Reader (OMR)",
            desc: "Processes localized bubble-sheet assessment sheets in legacy batches.",
            ans1: "special",
            ans2: "usb",
            ans3: "static"
        },
        {
            id: "mouse",
            name: "Ergonomic Optical Mouse",
            desc: "Standard Human Interface Device (HID) tracking basic structural inputs.",
            ans1: "standard",
            ans2: "usb",
            ans3: "latency"
        },
        {
            id: "oscilloscope",
            name: "USB-Linked Oscilloscope",
            desc: "Diagnostic device capturing ongoing real-time electrical waveforms.",
            ans1: "special",
            ans2: "usb",
            ans3: "telemetry"
        },
        {
            id: "monitor",
            name: "External 4K LED Monitor",
            desc: "High-density matrix output screen rendering graphical frames.",
            ans1: "standard",
            ans2: "hdmi",
            ans3: "video"
        },
        {
            id: "condenser_mic",
            name: "Studio Condenser Microphone",
            desc: "Professional production audio unit capturing balanced wave telemetry.",
            ans1: "special",
            ans2: "xlr",
            ans3: "telemetry"
        }
    ];

    function renderMatrix() {
        const tbody = document.getElementById('matrix-body');
        tbody.innerHTML = dataset.map(row => `
            <tr data-id="${row.id}">
                <td>
                    <span class="hardware-name">${row.name}</span>
                    <span class="hardware-desc">${row.desc}</span>
                </td>
                <td>
                    <select class="col1" data-correct="${row.ans1}">
                        <option value="">-- Choose --</option>
                        <option value="standard">Standard I/O</option>
                        <option value="special">Specialized Tech Tool</option>
                    </select>
                </td>
                <td>
                    <select class="col2" data-correct="${row.ans2}">
                        <option value="">-- Choose --</option>
                        <option value="usb">USB-A / USB-C</option>
                        <option value="hdmi">HDMI / DisplayPort</option>
                        <option value="xlr">XLR 3-Pin</option>
                    </select>
                </td>
                <td>
                    <select class="col3" data-correct="${row.ans3}">
                        <option value="">-- Choose --</option>
                        <option value="latency">Low Latency / Pure Control</option>
                        <option value="video">High Video Bandwidth</option>
                        <option value="telemetry">High Frequency Telemetry</option>
                        <option value="static">Low Data / Static Batches</option>
                    </select>
                </td>
            </tr>
        `).join('');
    }

    function evaluateMatrix() {
        const rows = document.querySelectorAll('#matrix-body tr');
        let correctPoints = 0;
        let totalPoints = dataset.length * 3;

        rows.forEach(row => {
            const selects = row.querySelectorAll('select');
            selects.forEach(select => {
                const choice = select.value;
                const correct = select.getAttribute('data-correct');

                if (choice === correct) {
                    select.className = select.className.split(' ')[0] + ' input-correct';
                    correctPoints++;
                } else {
                    select.className = select.className.split(' ')[0] + ' input-error';
                }
            });
        });

        const scoreBox = document.getElementById('scoreBox');
        scoreBox.style.display = 'block';
        scoreBox.innerText = `Verification Report: ${correctPoints} / ${totalPoints} structural metrics successfully aligned.`;

        if (correctPoints === totalPoints) {
            scoreBox.style.backgroundColor = 'rgba(40, 167, 69, 0.1)';
            scoreBox.style.borderColor = 'var(--success-border)';
            scoreBox.style.color = '#81c784';
        } else {
            scoreBox.style.backgroundColor = 'rgba(220, 53, 69, 0.1)';
            scoreBox.style.borderColor = 'var(--error-border)';
            scoreBox.style.color = '#e57373';
        }
    }

    function resetForm() {
        renderMatrix();
        const scoreBox = document.getElementById('scoreBox');
        scoreBox.style.display = 'none';
    }

    // Initialize layout
    renderMatrix();
</script>
</body>
</html>
