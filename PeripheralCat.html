<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peripheral Categorization</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }
        .card { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        select { padding: 6px; border-radius: 4px; border: 1px solid #ccc; }
        button { width: 100%; margin-top: 20px; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .feedback { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Peripheral Classification</h2>
    <p>Classify each hardware device correctly:</p>
    
    <div class="row">
        <span>1. Optical Mark Reader (OMR)</span>
        <select class="quiz-select" data-ans="special">
            <option value="">-- Choose --</option>
            <option value="standard">Standard I/O</option>
            <option value="special">Specialized Tool</option>
        </select>
    </div>
    <div class="row">
        <span>2. Computer Mouse</span>
        <select class="quiz-select" data-ans="standard">
            <option value="">-- Choose --</option>
            <option value="standard">Standard I/O</option>
            <option value="special">Specialized Tool</option>
        </select>
    </div>
    <div class="row">
        <span>3. Oscilloscope (USB-linked)</span>
        <select class="quiz-select" data-ans="special">
            <option value="">-- Choose --</option>
            <option value="standard">Standard I/O</option>
            <option value="special">Specialized Tool</option>
        </select>
    </div>
    <div class="row">
        <span>4. LED Monitor</span>
        <select class="quiz-select" data-ans="standard">
            <option value="">-- Choose --</option>
            <option value="standard">Standard I/O</option>
            <option value="special">Specialized Tool</option>
        </select>
    </div>

    <button onclick="checkAnswers()">Check Answers</button>
    <div class="feedback" id="feedback"></div>
</div>

<script>
    function checkAnswers() {
        const selects = document.querySelectorAll('.quiz-select');
        let correctCount = 0;
        
        selects.forEach(select => {
            if(select.value === select.getAttribute('data-ans')) {
                select.style.borderColor = "#28a745";
                correctCount++;
            } else {
                select.style.borderColor = "#dc3545";
            }
        });
        
        const feedback = document.getElementById('feedback');
        feedback.innerText = `You got ${correctCount} out of ${selects.length} right!`;
        feedback.style.color = correctCount === selects.length ? "#28a745" : "#dc3545";
    }
</script>
</body>
</html>
